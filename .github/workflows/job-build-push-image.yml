name: Job Build & Push Docker Image

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      ref:
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  build:
    name: Build docker image ${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Debug Secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "DOCKER_USERNAME: ${DOCKER_USERNAME}"
          echo "DOCKER_PASSWORD length: ${#DOCKER_PASSWORD}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          set -e
          IMAGE_NAME=asd2321s2/express-api
          TAG=${{ github.sha }}

          echo "Building Docker image with tag: $TAG"
          docker build --cache-from=type=registry,ref=$IMAGE_NAME:latest \
                       --cache-to=type=inline \
                       -t $IMAGE_NAME:$TAG .

          echo "Pushing image to Docker Hub"
          docker push $IMAGE_NAME:$TAG

      - name: Tag and push latest image
        run: |
          set -e
          IMAGE_NAME=asd2321s2/express-api
          TAG=${{ github.sha }}

          echo "Tagging latest image"
          docker tag $IMAGE_NAME:$TAG $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest

      - name: Tag and push release versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          IMAGE_NAME=asd2321s2/express-api
          TAG=${GITHUB_REF#refs/tags/}

          echo "Tagging release version: $TAG"
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:$TAG

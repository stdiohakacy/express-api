name: Job Deploy BE to Minikube

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      ref:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to Minikube
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Ensure Minikube is Running
        run: |
          if ! minikube status | grep -q "Running"; then
            echo "Minikube is not running. Starting Minikube..."
            minikube start --cpus=6 --memory=12288 --driver=docker --addons=ingress
          else
            echo "✅ Minikube is already running."
          fi
          echo "Current Minikube Status:"
          minikube status

      # - name: Set up kubectl
      #   run: |
      #     echo "⏳ Configuring kubectl for Minikube..."
      #     kubectl version --client
      #     minikube update-context
      #     echo "✅ Kubectl is configured."

      # - name: Configure kubeconfig
      #   run: |
      #     echo "⏳ Setting up Kubernetes config..."
      #     echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > $HOME/.kube/config
      #     chmod 600 $HOME/.kube/config
      #     echo "✅ Kubernetes config is set up."

      - name: Apply Kubernetes Namespaces
        run: |
          echo "⏳ Applying Kubernetes namespaces..."
          kubectl apply -f k8s/express-namespace.yaml --wait
          echo "✅ Namespaces applied."

      - name: Apply Secrets
        run: |
          echo "⏳ Applying secrets..."
          kubectl apply -f k8s/express-mongo-secret.yaml --wait
          kubectl apply -f k8s/express-api-secret.yaml --wait
          kubectl apply -f k8s/express-datadog-secret.yaml --wait
          echo "✅ Secrets applied."

      - name: Apply RBAC Configurations
        run: |
          echo "⏳ Applying RBAC configurations..."
          kubectl apply -f k8s/express-datadog-clusterrole.yaml --wait
          kubectl apply -f k8s/express-datadog-serviceaccount.yaml --wait
          kubectl apply -f k8s/express-datadog-rolebinding.yaml --wait
          echo "✅ RBAC configurations applied."

      - name: Apply StatefulSets
        run: |
          echo "⏳ Applying MongoDB StatefulSet..."
          kubectl apply -f k8s/express-mongo-statefulset.yaml --wait
          kubectl apply -f k8s/express-mongo-srv.yaml --wait
          echo "✅ MongoDB StatefulSet applied."

      - name: Apply Deployments & Services
        run: |
          echo "⏳ Deploying Express API..."
          kubectl apply -f k8s/express-api-depl.yaml --wait
          kubectl apply -f k8s/express-api-srv.yaml --wait
          echo "✅ Express API Deployment applied."

      - name: Apply DaemonSets (Datadog)
        run: |
          echo "⏳ Deploying Datadog Agent..."
          kubectl apply -f k8s/express-datadog-daemonset.yaml --wait
          echo "✅ Datadog DaemonSet applied."

      - name: Restart Deployment (Rolling Update)
        run: |
          echo "🔄 Restarting Express API deployment..."
          kubectl rollout restart deployment/express-api-depl -n express-dev
          echo "✅ Rolling update successful."

      - name: Verify Deployment Health
        run: |
          echo "🔍 Checking pod and service status..."
          kubectl get pods -n express-dev -o wide
          kubectl get svc -n express-dev
          kubectl get endpoints -n express-dev
          kubectl describe deployment express-api-depl -n express-dev
          echo "✅ Deployment verification complete."

      - name: Validate Logs and Connectivity
        run: |
          echo "🔍 Checking logs for Express API..."
          kubectl logs --selector=app=express-api -n express-dev --tail=20
          echo "✅ Logs retrieved."

